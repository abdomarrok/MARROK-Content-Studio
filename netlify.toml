[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Omit public/identifier env vars (e.g. ADMIN_USERNAME="admin") from false-positive literal matching
  # while keeping strict secret scanning active for all keys, hashes, and tokens.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USERNAME,CLOUDINARY_CLOUD_NAME"

[functions]
  node_bundler = "esbuild"

# Top-down redirect ordering: /api/* always executes serverless functions BEFORE SPA fallback.
# Do NOT add force = true to the catch-all SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
